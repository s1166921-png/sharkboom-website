server {
    listen 80;
    listen [::]:80;
    server_name sharkboom.meiouyuncang.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sharkboom.meiouyuncang.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sharkboom.meiouyuncang.com;
    ssl_certificate /etc/letsencrypt/live/sharkboom.meiouyuncang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sharkboom.meiouyuncang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/sharkboom/current;
    index index.html;
    error_page 404 /404.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        client_max_body_size 64k;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location ~ ^/(admin/?|orders/?|portal/(app\.js|styles\.css))$ {
        proxy_pass http://127.0.0.1:3198;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location ~ ^/(professional|ocean|editorial|motion-3d)/?$ { return 301 /; }
    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /studio/optimized/ {
        try_files $uri =404;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:png|jpe?g|webp|svg|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
